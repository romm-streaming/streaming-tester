name: Build webstation image

on:
  workflow_dispatch:
  schedule:
    # Hourly, off the hour: GitHub delays scheduled runs queued at the top of
    # the hour.
    - cron: "37 * * * *"

env:
  UPSTREAM_REPO: linuxserver/docker-webstation
  UPSTREAM_BRANCH: romm
  BROKER_REPO: romm-streaming/romm-broker
  IMAGE: ghcr.io/${{ github.repository_owner }}/webstation

concurrency:
  group: build-webstation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the boot test
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A build is tagged <romm-broker release>-<docker-webstation commit>, and
      # that tag is added last, so an existing tag means streaming-v2 already
      # has it.
      - name: Find the upstream versions
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --single-branch --branch "$UPSTREAM_BRANCH" "https://github.com/${UPSTREAM_REPO}.git" webstation
          # linuxserver.io's bot commits version bumps and README edits to this
          # branch. Only Dockerfile and root/ go into the image, so only those
          # commits start a multi-hour build.
          commit="$(git -C webstation log -1 --format=%H -- Dockerfile root)"
          git -C webstation checkout --quiet "$commit"
          # Without BROKER_RELEASE the Dockerfile downloads romm-broker's latest
          # release itself, and a new broker release would never start a build.
          release="$(gh api "repos/${BROKER_REPO}/releases/latest" --jq .tag_name)"
          tag="${release}-${commit:0:8}"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMAGE:$tag" >/dev/null 2>&1; then
            echo "$tag is already built"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $tag"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # Dolphin, Eden and Cemu compile from source, and a hosted runner is only
      # guaranteed 14 GB of free disk.
      - name: Free disk space
        if: steps.ref.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache
          docker image prune --all --force
          df -h /

      # Hosted runners have no swap, and one compile running out of memory
      # loses the whole build.
      - name: Add swap
        if: steps.ref.outputs.build == 'true'
        run: |
          sudo fallocate --length 8G /build-swap
          sudo chmod 600 /build-swap
          sudo mkswap /build-swap
          sudo swapon /build-swap

      # Upstream's Dockerfile is tuned for linuxserver.io's build servers
      # ("make -j16", ninja's default of CPUs + 2 jobs). A hosted runner has 4
      # CPUs and 16 GB of memory.
      - name: Match compile jobs to the runner
        if: steps.ref.outputs.build == 'true'
        run: |
          # shellcheck disable=SC2016 # $(nproc) is for the Dockerfile's RUN steps
          sed -Ei \
            -e 's/\b(make|ninja) -j ?[0-9]+/\1 -j$(nproc)/g' \
            -e 's/\bcmake --build ([^ ]+) &&/cmake --build \1 --parallel $(nproc) \&\&/g' \
            webstation/Dockerfile
          git -C webstation --no-pager diff

      - name: Set up Buildx
        id: buildx
        if: steps.ref.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          # The emulator stages are independent, so BuildKit would compile them
          # all at once. Each compile already uses every CPU.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      # Pushed untagged, so a build that fails the boot test never reaches
      # testers and the next run tries again.
      - name: Build and push by digest
        id: build
        if: steps.ref.outputs.build == 'true'
        env:
          RELEASE: ${{ steps.ref.outputs.release }}
        run: |
          docker buildx build \
            --build-arg "BROKER_RELEASE=$RELEASE" \
            --output "type=image,name=$IMAGE,push-by-digest=true,push=true" \
            --metadata-file build.json \
            webstation
          echo "digest=$(jq -r '."containerimage.digest"' build.json)" >> "$GITHUB_OUTPUT"

      # The builder's state is tens of GB, and loading the 11 GB image next to
      # it could fill the runner's disk.
      - name: Remove the builder
        if: steps.ref.outputs.build == 'true'
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          docker buildx rm "$BUILDER"
          df -h /

      - name: Boot test
        if: steps.ref.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          .github/scripts/webstation-boot-test.sh "$IMAGE@$DIGEST"

      - name: Tag the build
        if: steps.ref.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:streaming-v2" "$IMAGE@$DIGEST"
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"
