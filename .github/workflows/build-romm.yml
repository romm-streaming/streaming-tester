name: Build RomM image

on:
  repository_dispatch:
    types: [romm-commit]
  workflow_dispatch:
    inputs:
      sha:
        description: "Upstream commit SHA to build (defaults to the emulator-streaming-v2 merge commit)"
        required: false
        default: "26476f603a1b17b4c4f0ab3e5e9d005c85307526"

env:
  # emulator-streaming-v2 (rommapp/romm#4314) merged into master on 2026-09-06.
  # Building from upstream master/HEAD directly, pinned by default to that merge
  # commit, instead of a personal fork branch that can move or disappear.
  UPSTREAM_REPO: rommapp/romm
  UPSTREAM_BRANCH: master
  IMAGE: ghcr.io/${{ github.repository_owner }}/romm

concurrency:
  group: build-romm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone upstream branch
        run: |
          git clone --branch "$UPSTREAM_BRANCH" "https://github.com/${UPSTREAM_REPO}.git" romm

      - name: Checkout referenced commit
        id: ref
        working-directory: romm
        run: |
          SHA="${{ github.event.client_payload.sha || github.event.inputs.sha }}"
          if [ -n "$SHA" ]; then
            git fetch origin "$SHA"
            git checkout "$SHA"
          fi
          FULL=$(git rev-parse HEAD)
          echo "sha=$FULL" >> "$GITHUB_OUTPUT"
          echo "Building ${UPSTREAM_REPO}@${FULL}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        working-directory: romm
        run: |
          docker build -t "$IMAGE:${{ steps.ref.outputs.sha }}" -f docker/Dockerfile .
          # "streaming-v2" is the one tag streaming-tester.sh actually pulls. It
          # only moves when a maintainer reruns this workflow on purpose (with a
          # new sha input); it never drifts on its own the way ":latest" would.
          docker tag "$IMAGE:${{ steps.ref.outputs.sha }}" "$IMAGE:streaming-v2"

      - name: Push image
        run: |
          docker push "$IMAGE:${{ steps.ref.outputs.sha }}"
          docker push "$IMAGE:streaming-v2"
