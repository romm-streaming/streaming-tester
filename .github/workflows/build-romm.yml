name: Build RomM image

on:
  workflow_dispatch:
  schedule:
    # Hourly, off the hour: GitHub delays scheduled runs queued at the top of
    # the hour.
    - cron: "23 * * * *"

env:
  UPSTREAM_REPO: rommapp/romm
  UPSTREAM_BRANCH: master
  IMAGE: ghcr.io/${{ github.repository_owner }}/romm

concurrency:
  group: build-romm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each build is also tagged with its upstream commit, and that tag is
      # pushed last, so an existing tag means streaming-v2 already has it.
      - name: Find the upstream commit
        id: ref
        run: |
          sha="$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/heads/${UPSTREAM_BRANCH}" | cut -f1)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read ${UPSTREAM_REPO} ${UPSTREAM_BRANCH}: '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMAGE:$sha" >/dev/null 2>&1; then
            echo "${UPSTREAM_REPO}@${sha} is already built"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building ${UPSTREAM_REPO}@${sha}"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.ref.outputs.build == 'true'
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          git init --quiet romm
          git -C romm fetch --quiet --depth 1 "https://github.com/${UPSTREAM_REPO}.git" "$SHA"
          git -C romm checkout --quiet FETCH_HEAD
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:streaming-v2" -f romm/docker/Dockerfile romm

      - name: Push image
        if: steps.ref.outputs.build == 'true'
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          docker push "$IMAGE:streaming-v2"
          docker push "$IMAGE:$SHA"
